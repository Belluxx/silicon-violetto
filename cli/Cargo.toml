[package]
name = "violetto-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "violetto"
path = "src/main.rs"

[dependencies]
violetto = { path = "../engine" }
serde_json = "1"
# The Python side's version, with the same regex engine (onig), so ids match transformers'.
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
clap = { version = "4.6.7", features = ["derive"] }
